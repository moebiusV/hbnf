# The same rules as expanded.conf, written with macros.
ext_if = "em0"
int_if = "lo0"
net = "10.1.2"
ports = "{ 22, 80, 443 }"
peers = "{" $net.1 $net.2 "}"
pass in on $ext_if inet proto tcp from any to $net.10 port $ports keep state
pass out on $int_if from $peers to any
block in quick on { $ext_if $int_if } from $net.0/24
