# Forms bgpd's parse.y accepts that the grammar used to refuse
AS 64512
roa-set {
	10/8 source-as 1
	192.0.2.0/24 source-as 2
}
aspa-set {
	customer-as 5 provider-as { 1, 2 inet, 7 inet6 }
}
match from any community local-as:5678
match from any community 1234:local-as
match from any large-community 1234:5678:local-as
match from any large-community neighbor-as:5678:90
match from any ext-community ovs *
match from any ext-community ovs not-found
