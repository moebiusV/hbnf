# The longer of two alternatives with the same start goes first
# (`tls keypair NAME key FILE`, `return error { ... }`, `edh params`),
# and a quoted value with a colon is a string, not a port range.
http protocol "web" {
	tls keypair "127.0.0.1" key "127.0.0.1.key"
	tls keypair "127.0.0.1" cert "127.0.0.1.crt"
	tls keypair "127.0.0.1"
	tls edh params auto
	return error { style "body { background: white; }" }
	match request header append "X-Forwarded-By" \
	    value "$SERVER_ADDR:$SERVER_PORT"
}
