# listen on *, location *, and parse.y's braced option blocks (one option
# per line, or comma-separated), as in /etc/examples/httpd.conf
server "example.com" {
	listen on * port 80
	listen on 127.0.0.1 tls port 443
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 302 "https://$HTTP_HOST$REQUEST_URI"
	}
	tls {
		certificate "/etc/ssl/example.com.fullchain.pem"
		key "/etc/ssl/private/example.com.key"
	}
	connection { timeout 30, max requests 100 }
	request { strip 1 }
	directory { auto index, index "index.html" }
	log { style combined, access "access.log" }
	tcp { nodelay, backlog 10 }
	hsts { max-age 31536000, subdomains }
	fastcgi { socket "/run/php-fpm.sock", strip 1 }
	tls ticket lifetime default
	directory auto index
}
