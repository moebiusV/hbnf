# Tokens parse.y's lexer reads as one word: a scoped IPv6 address, a
# percentage; and parse.y's optional comma in `set prio`.
pass in quick on lo0 from fe80::1%lo0 to fe80::1%lo0
pass in probability 50%
pass out on lo0 proto tcp from any to any port 22 set prio (5 2)
pass out on lo0 proto tcp from any to any port 22 set prio (5, 2)
