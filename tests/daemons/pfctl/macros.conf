# Macros, as pfctl's parse.y reads them: `$name` expands at the start of a
# word outside quotes, glued to what follows; a value is expanded when it is
# defined, not again when it is used.
ext_if = "lo0"
tcp_services = "{ 22, 113 }"
net = "10.0.0"
peers = "{" $net.1 $net.2 "}"
both = $ext_if lo1
bad_ip = "192.0.2.66"
pass in on $ext_if proto tcp to port $tcp_services
pass in from $net.5
pass out on $ext_if from $peers
pass in on { $both } from any to any
table <bad> { $bad_ip, 198.51.100.7 }
block in quick from <bad>
# a quoted `$` is not a macro, nor is one inside a word
pass in on $ext_if proto tcp from any to any label "$ext_if and x$net"
pass in on $ext_if tagged x$net
