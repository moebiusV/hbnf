# Keyword-only alternatives (dir, af, action, ...): each of these words is a
# keyword token, and the rule that takes it must accept it.
pass in on em0 inet proto tcp from 10.0.0.1 port 22 to any keep state
pass out quick on lo0 inet proto tcp from 10.0.0.2 port 1024 to 10.0.0.3 port 25 keep state
block in all
block out all
pass in inet6 all
pass out inet all
