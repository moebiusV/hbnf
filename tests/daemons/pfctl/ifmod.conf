# Interface names with address modifiers: one bareword to parse.y's lexer
pass in on lo0 from lo0:network to any keep state
match on lo0 from ::1 to (lo0:peer:0) binat-to ::1
match out on lo0 inet from <regress.1> to <regress.2> nat-to lo0:0
pass out on lo0 from any to em0:broadcast
pass in from any port 8000:8010 to any
