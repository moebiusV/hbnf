# snmpd's parse.y compares auth and enc with strcasecmp: any case matches.
user "alice" authkey "password1" auth hmac-sha256 enckey "password2" enc aes
user "bob" authkey "password1" auth HMAC-SHA1 enckey "password2" enc AES
user "carol" authkey "password1" auth usmhmac192sha256authprotocol enc CFB128-AES-128
