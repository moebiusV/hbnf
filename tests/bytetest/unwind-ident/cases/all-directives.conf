# Every directive, in its one-line and its block form.
preference { DoT recursor stub }
forwarder 192.0.2.53
forwarder {
	192.0.2.1 port 5353
	2001:db8::53 DoT
	192.0.2.2 port 8853 authentication name dns.example DoT
	192.0.2.3 authentication name dns2.example DoT
}
block list "/etc/unwind.block" log
force accept bogus forwarder { example.com. example.net }
force recursor {
	intranet.example
	lab.example.
}
